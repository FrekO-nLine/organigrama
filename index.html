<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Organigrama 3D - Fresko Milenio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; text-align: center; padding: 20px; }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: inline-block;
            margin: 15px;
            padding: 20px;
            width: 250px;
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .card:hover {
            transform: perspective(1000px) rotateX(5deg) rotateY(5deg) scale(1.05);
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
        }
        .avatar-3d {
            width: 80px;
            height: 80px;
            background: #ddd;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.2);
        }
        h3 { font-size: 16px; margin: 5px 0; color: #333; }
        p { font-size: 13px; color: #666; margin: 0; }
    </style>
</head>
<body>

    <h1>Organigrama Fresko Milenio</h1>
    
    <!-- Ejemplo de Nodo Gerente -->
    <div class="card">
        <div class="avatar-3d">Avatar 3D</div>
        <h3>Gerardo Rodríguez Mejía</h3>
        <p>Gerente de Operaciones[cite: 1]</p>
    </div>

</body>
</html>
